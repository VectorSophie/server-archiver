<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive // Search</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="topbar">
  <div class="brand">ARCHIVE<span class="slash">//</span>LEAGUE SEARCH</div>
  <div class="operator">
    <span class="dot"></span>
    <span id="operator-name"></span>
    <span>|</span>
    <a href="/logout">sign out</a>
  </div>
</div>

<div class="search-wrap">
  <form id="search-form" class="search-bar">
    <span class="prompt">&gt;</span>
    <input type="text" id="query" name="query" placeholder="from:milkika in:general after:2025-09-01" autofocus>
    <button type="submit">SEARCH</button>
  </form>
</div>

<div class="meta" id="meta" style="display:none"></div>

<div class="results-wrap">
  <div class="results" id="results">
    <div class="hint">
      type a query and hit enter.<br>
      filters: from:&lt;name&gt; &nbsp; in:&lt;channel&gt; &nbsp; category:&lt;name&gt; &nbsp; before:&lt;date&gt; &nbsp; after:&lt;date&gt;
    </div>
  </div>
</div>

<div class="footer">
  <span>local instance &middot; not indexed by search engines</span>
  <span></span>
</div>

<script src="/static/app.js"></script>
</body>
</html>
